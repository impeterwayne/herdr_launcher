id = "herdr-launcher"
name = "herdr-launcher"
version = "0.1.0"
description = "Fast YOLO agent launchers (opencode/agy/codex/claude) and a right-docked sidebar for Antigravity, Android Studio, VS Code, Explorer, symlinks, OpenSpec and Plane."
min_herdr_version = "0.8.0"
platforms = ["linux", "macos", "windows"]

[[panes]]
id = "launcher-sidebar"
title = "Launcher"
placement = "split"
command = ["node", "-e", 'const p=process.cwd();const r=p.startsWith("\\\\?\\")?p.slice(4):p;process.argv=["node",r+"/bin/launcher.js"];require(r+"/bin/launcher.js")']

[[panes]]
id = "symlinks-popup"
title = "Symlinks"
placement = "popup"
width = 52
height = "70%"
command = ["node", "-e", 'const p=process.cwd();const r=p.startsWith("\\\\?\\")?p.slice(4):p;process.argv=["node",r+"/bin/tool-pane.js","symlinks","--popup"];require(r+"/bin/tool-pane.js")']

[[panes]]
id = "openspec-popup"
title = "OpenSpec setup"
placement = "popup"
width = 44
height = "70%"
command = ["node", "-e", 'const p=process.cwd();const r=p.startsWith("\\\\?\\")?p.slice(4):p;process.argv=["node",r+"/bin/tool-pane.js","openspec","--popup"];require(r+"/bin/tool-pane.js")']

[[panes]]
id = "plane-popup"
title = "Plane tasks"
placement = "popup"
width = 64
height = "70%"
command = ["node", "-e", 'const p=process.cwd();const r=p.startsWith("\\\\?\\")?p.slice(4):p;process.argv=["node",r+"/bin/tool-pane.js","plane","--popup"];require(r+"/bin/tool-pane.js")']

[[startup]]
command = ["node", "-e", 'const p=process.cwd();const r=p.startsWith("\\\\?\\")?p.slice(4):p;require(r+"/bin/startup.js")']

[[actions]]
id = "toggle-launcher"
title = "Toggle launcher sidebar"
description = "Dock the launcher on the right edge (focus it if open; close it if focused)."
command = ["node", "bin/toggle-launcher.js"]

[[actions]]
id = "watch-tabs-start"
title = "Auto-dock the launcher in new tabs"
description = "Watch tab.created and dock a launcher sidebar into every tab opened from now on."
command = ["node", "bin/watch-tabs.js", "--start"]

[[actions]]
id = "watch-tabs-stop"
title = "Stop auto-docking in new tabs"
description = "Stop the tab watcher. Existing sidebars stay where they are."
command = ["node", "bin/watch-tabs.js", "--stop"]

[[actions]]
id = "dock-launcher-everywhere"
title = "Dock a launcher sidebar in every tab"
description = "One pass over the open tabs: any tab without a launcher gets one."
command = ["node", "bin/watch-tabs.js", "--once"]

[[actions]]
id = "stack-mode"
title = "Stack mode (zoom, launcher visible)"
description = "One work pane fills the tab with the launcher still docked; press again to put the layout back."
command = ["node", "bin/stack-mode.js"]

[[actions]]
id = "focus-mode"
title = "Focus mode (zoom, launcher visible)"
description = "One work pane fills the tab with the launcher still docked; press again to put the layout back."
command = ["node", "bin/focus-mode.js"]

[[actions]]
id = "tool-symlinks"
title = "Symlinks"
description = "Open the symlink manager as a popup."
command = ["node", "bin/tool-launch.js", "symlinks"]

[[actions]]
id = "tool-openspec"
title = "OpenSpec setup"
description = "Open the OpenSpec toolkit deployer as a popup."
command = ["node", "bin/tool-launch.js", "openspec"]

[[actions]]
id = "tool-plane"
title = "Plane tasks"
description = "Open the Plane issue list and task synchronizer as a popup."
command = ["node", "bin/tool-launch.js", "plane"]

[[actions]]
id = "agent-agy-yolo"
title = "Antigravity CLI (YOLO)"
description = "Antigravity CLI with --dangerously-skip-permissions."
command = ["node", "bin/agent-launch.js", "agy-yolo"]

[[actions]]
id = "agent-claude-danger"
title = "Claude (skip permissions)"
description = "Claude Code with --dangerously-skip-permissions."
command = ["node", "bin/agent-launch.js", "claude-danger"]

[[actions]]
id = "agent-codex-yolo"
title = "Codex (YOLO)"
description = "Codex with --dangerously-bypass-approvals-and-sandbox. Isolated environments only."
command = ["node", "bin/agent-launch.js", "codex-yolo"]

[[actions]]
id = "agent-opencode-auto"
title = "OpenCode (auto)"
description = "OpenCode with --auto: auto-approves everything not explicitly denied."
command = ["node", "bin/agent-launch.js", "opencode-auto"]

[[actions]]
id = "agent-terminal"
title = "Terminal (only)"
description = "Open an interactive terminal pane only (no agent)."
command = ["node", "bin/agent-launch.js", "terminal"]

[[actions]]
id = "open-antigravity"
title = "Open Antigravity IDE"
description = "Open the active pane's directory in Antigravity IDE."
command = ["node", "bin/app-open.js", "antigravity"]

[[actions]]
id = "open-android-studio"
title = "Open Android Studio"
description = "Open the active pane's directory in Android Studio."
command = ["node", "bin/app-open.js", "android-studio"]

[[actions]]
id = "open-vscode"
title = "Open VS Code"
description = "Open the active pane's directory in VS Code."
command = ["node", "bin/app-open.js", "vscode"]

[[actions]]
id = "open-explorer"
title = "Open File Explorer"
description = "Reveal the active pane's directory in the file manager."
command = ["node", "bin/app-open.js", "explorer"]
